[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard"
version = "0.1.0"
description = "İndirilen AI modellerinde kod/servis tehditlerini tarayan güvenlik aracı"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "py7zr>=0.21",
    "h5py>=3.11",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
modelguard = "modelguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["modelguard*"]
